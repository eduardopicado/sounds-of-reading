name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch with a pull request open was running the whole suite twice, once
# for the push and once for the pull request, on two separate runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The content test first and on its own: a wrong word is the worst bug
      # this app can ship, so it fails the build before anything else runs.
      - name: Content
        run: npm run validate:content

      - name: Unit
        run: npm run test:unit

      - name: Typecheck and build
        run: npm run build

  # The browser tests, one job per device, side by side. In one job they
  # took 22 minutes: every test runs at four sizes, and a whole round of a
  # game waits out its own pauses. Run apart they finish in the time of the
  # slowest, and WebKit, the slowest, is split in two. The repository is
  # public, so the extra runners cost nothing.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    # a healthy job takes under ten minutes; this only catches a genuine hang
    timeout-minutes: 30
    strategy:
      # one device failing should not hide what the others found
      fail-fast: false
      matrix:
        include:
          - { name: ipad-portrait, project: ipad-portrait, browser: chromium, shard: 1/1 }
          - { name: ipad-landscape, project: ipad-landscape, browser: chromium, shard: 1/1 }
          - { name: phone, project: phone, browser: chromium, shard: 1/1 }
          - { name: ipad-webkit 1 of 2, project: ipad-webkit, browser: webkit, shard: 1/2 }
          - { name: ipad-webkit 2 of 2, project: ipad-webkit, browser: webkit, shard: 2/2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # each job serves its own build; it takes seconds
      - name: Build
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End to end
        run: npx playwright test --project ${{ matrix.project }} --shard ${{ matrix.shard }}

      # traces of what failed, to open with `npx playwright show-trace`
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
