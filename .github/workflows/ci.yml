name: CI

on:
  push:
    branches: [main]
  pull_request:

# A branch with a pull request open was running the whole suite twice, once
# for the push and once for the pull request, on two separate runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # the suite takes about three minutes; this only catches a genuine hang
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The content test first and on its own: a wrong word is the worst bug
      # this app can ship, so it fails the build before anything else runs.
      - name: Content
        run: npm run validate:content

      - name: Typecheck and build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End to end
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
