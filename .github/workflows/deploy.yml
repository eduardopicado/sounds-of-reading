name: Deploy to GitHub Pages

# Only what passed CI goes live. This used to run on every push to main and
# check nothing but the content test, so a commit whose unit or browser tests
# failed was still published to the iPad. Now it waits for the CI workflow
# on that push to finish, and deploys only when it succeeded.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # a deploy by hand, for when Pages needs a nudge; it skips the CI wait
  workflow_dispatch:

# Pages needs these; nothing here can write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # a CI run for a pull request never deploys, and a failed or cancelled
    # one never does either (a newer push cancels the older run's CI)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # exactly the commit CI tested, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Belt and braces: a wrong word reaching a child is the worst thing
      # this app can do, so the content test runs again right before shipping.
      - name: Content
        run: npm run validate:content

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
