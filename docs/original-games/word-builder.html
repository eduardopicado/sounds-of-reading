<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Builder — ai/ay · ee/ea · sh · ng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#10403E; --deep-2:#0B302F; --paper:#FFF6E7; --ink:#14312F;
    --mustard:#F3B229; --tomato:#E4572E; --mint:#79D3B0; --plum:#8367A8; --sky:#3D8FCB;
    --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --reading:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(circle at 20% 0%, rgba(131,103,168,.18), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(243,178,41,.14), transparent 45%),
      var(--deep);
    color:var(--paper);font-family:var(--reading);min-height:100vh;
    padding:16px 14px 26px;-webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:620px;margin:0 auto}
  header{text-align:center;margin-bottom:10px}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:.95;margin:0;letter-spacing:-.5px}
  h1 .swash{color:var(--mustard);position:relative;display:inline-block}
  h1 .swash::after{content:"";position:absolute;left:2%;right:2%;bottom:-2px;height:5px;border-radius:99px;background:var(--tomato)}
  .tag{font-size:13px;opacity:.72;margin:8px 0 0}

  .panel{background:rgba(255,246,231,.06);border:1px solid rgba(255,246,231,.14);border-radius:var(--radius);padding:12px;margin:14px 0}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lbl{font-family:var(--display);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;opacity:.65;width:100%;margin-bottom:2px}
  select{font-family:var(--reading);font-size:15px;padding:8px 10px;border-radius:12px;border:2px solid rgba(255,246,231,.3);background:var(--deep-2);color:var(--paper)}
  .btn{font-family:var(--display);font-weight:800;font-size:16px;padding:10px 20px;border-radius:99px;border:none;cursor:pointer;background:var(--mustard);color:var(--deep-2);box-shadow:0 4px 0 #C98F14;transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C98F14}
  .btn.ghost{background:transparent;color:var(--paper);border:2px solid rgba(255,246,231,.3);box-shadow:none}
  button:focus-visible,select:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

  .score{text-align:center;font-family:var(--display);font-weight:600;font-size:15px;opacity:.85;margin:2px 0 10px}
  .score b{font-size:22px;font-weight:800;color:var(--mustard)}

  /* ---- the word machine (signature) ---- */
  .machine{
    background:var(--paper);color:var(--ink);border-radius:22px;
    padding:18px 14px 14px;text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.3);
    border-bottom:8px solid var(--fam,var(--mustard));
  }
  .slots{display:flex;justify-content:center;align-items:stretch;gap:6px;min-height:96px}
  .slot{
    font-family:var(--reading);font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border-radius:14px;padding:6px 12px;
    font-size:clamp(38px,12vw,60px);line-height:1;
  }
  .slot.onset{
    background:rgba(20,49,47,.08);min-width:1.6em;
    border:3px dashed rgba(20,49,47,.25);
  }
  .slot.onset.filled{border-style:solid;border-color:var(--ink);background:rgba(20,49,47,.05)}
  .slot.rime{
    background:var(--fam,var(--mustard));color:var(--deep-2);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);
  }
  .machine.pop .slots{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  .machine.silly .slots{animation:wobble .5s}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}

  .verdict{
    font-family:var(--display);font-weight:800;font-size:20px;
    min-height:1.6em;margin-top:8px;
  }
  .verdict.real{color:#1E8A5F}
  .verdict.silly{color:var(--tomato)}
  .verdict.idle{color:rgba(20,49,47,.4);font-weight:600;font-size:15px}
  .machine-actions{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .machine-actions .btn{font-size:14px;padding:8px 15px}
  .machine-actions .btn.ghost{color:var(--ink);border-color:rgba(20,49,47,.3)}

  /* ---- onset rack ---- */
  .rack{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin-top:14px;padding:12px;border-radius:var(--radius);
    background:rgba(255,246,231,.06);border:1px solid rgba(255,246,231,.14);
  }
  .tile{
    font-family:var(--reading);font-weight:700;font-size:clamp(18px,5vw,24px);
    padding:10px 16px;border-radius:12px;border:none;cursor:pointer;
    background:var(--paper);color:var(--ink);
    box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s,opacity .2s;
    min-width:2.4em;
  }
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .tile.current{background:var(--fam,var(--mustard));color:var(--deep-2)}
  .tile.used{opacity:.45}
  .tile.used::after{content:" ✓";font-size:.7em;color:#1E8A5F}

  /* ---- found words ---- */
  .found{margin-top:14px;padding:12px;border-radius:var(--radius);background:rgba(255,246,231,.06);border:1px dashed rgba(255,246,231,.22)}
  .found h2{font-family:var(--display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;opacity:.6;margin:0 0 8px}
  .list{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center}
  .list .empty{font-size:14px;opacity:.45}
  .tokn{font-family:var(--reading);font-weight:700;font-size:15px;padding:4px 12px;border-radius:99px;background:var(--mint);color:var(--deep-2);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  .tokn.sillyword{background:rgba(228,87,46,.85);color:var(--paper)}

  .win-overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(11,48,47,.9);backdrop-filter:blur(4px);z-index:20;padding:20px}
  .win-overlay.show{display:grid}
  .win-card{background:var(--paper);color:var(--ink);border-radius:24px;padding:28px 24px;text-align:center;max-width:340px;width:100%;border-bottom:10px solid var(--mustard)}
  .win-card h3{font-family:var(--display);font-weight:800;font-size:32px;margin:0 0 6px}
  .win-card p{margin:0 0 18px;font-size:16px}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Word <span class="swash">Builder</span></h1>
    <p class="tag">Keep the ending. Swap the front. What word do you get?</p>
  </header>

  <div class="panel">
    <div class="row">
      <span class="lbl">Word family</span>
      <select id="family" aria-label="Word family"></select>
      <select id="mode" aria-label="Which tiles to show">
        <option value="mixed" selected>Real + silly words</option>
        <option value="real">Real words only</option>
      </select>
      <button class="btn ghost" id="reset">Start over</button>
    </div>
  </div>

  <div class="score">Real words found <b id="found">0</b> of <span id="total">0</span></div>

  <div class="machine" id="machine">
    <div class="slots">
      <div class="slot onset" id="slotOnset">?</div>
      <div class="slot rime" id="slotRime">ain</div>
    </div>
    <div class="verdict idle" id="verdict">Tap a letter below to build a word</div>
    <div class="machine-actions">
      <button class="btn ghost" id="sayBtn">🔊 Say it again</button>
      <button class="btn ghost" id="shuffleBtn">🔀 Shuffle tiles</button>
    </div>
  </div>

  <div class="rack" id="rack"></div>

  <div class="found">
    <h2>Words you made</h2>
    <div class="list" id="list"><span class="empty">Nothing built yet.</span></div>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h3>Family complete!</h3>
    <p id="winText"></p>
    <button class="btn" id="nextFamily">Next family</button>
  </div>
</div>

<script>
/* rime = the fixed ending. real = onsets that make a real word. silly = onsets that don't. */
const FAMILIES = [
  {id:'ain', sound:'ai / ay', rime:'ain', color:'#E4572E',
   real:['r','m','p','g','br','ch','tr','st','dr'], silly:['z','sh','k','v']},
  {id:'ail', sound:'ai / ay', rime:'ail', color:'#E4572E',
   real:['m','s','t','n','p','r','sn','tr'], silly:['z','sh','d','v']},
  {id:'ay',  sound:'ai / ay', rime:'ay',  color:'#F3B229',
   real:['d','w','s','m','h','p','cl','pl','st','tr'], silly:['z','v','sh']},
  {id:'ee',  sound:'ee / ea', rime:'ee',  color:'#3D8FCB',
   real:['b','s','f','tr','thr','fr'], silly:['m','k','n','v']},
  {id:'eep', sound:'ee / ea', rime:'eep', color:'#3D8FCB',
   real:['k','d','sh','sl','w','st','cr','b'], silly:['m','z','v','f']},
  {id:'eat', sound:'ee / ea', rime:'eat', color:'#79D3B0',
   real:['b','h','m','n','s','tr','wh','ch'], silly:['z','g','v','k']},
  {id:'each',sound:'ee / ea', rime:'each',color:'#79D3B0',
   real:['b','r','t','p'], silly:['z','m','d','v']},
  {id:'ip',  sound:'sh', rime:'ip',  color:'#8367A8',
   real:['sh','ch','dr','tr','sk','fl','s','l','r','t','wh'], silly:['m','v','th','z']},
  {id:'ell', sound:'sh', rime:'ell', color:'#8367A8',
   real:['sh','b','f','s','t','w','sm','sp','y'], silly:['z','m','v','k']},
  {id:'ash', sound:'sh', rime:'ash', color:'#8367A8',
   real:['c','d','m','r','b','cr','fl','sm','tr','spl'], silly:['z','v','p','th']},
  {id:'ing', sound:'ng', rime:'ing', color:'#3FA796',
   real:['k','r','s','w','th','br','str','sw','spr'], silly:['m','v','z','d']},
  {id:'ong', sound:'ng', rime:'ong', color:'#3FA796',
   real:['l','s','str','g'], silly:['m','v','z','th']},
  {id:'atch', sound:'ch', rime:'atch', color:'#E4572E',
   real:['c','m','p','b','h','l','sn','scr'], silly:['z','v','th','g']},
  {id:'in-ch', sound:'ch', rime:'inch', color:'#E4572E',
   real:['p','w','f','fl','cl'], silly:['z','v','m','th']},
  {id:'ink', sound:'th (thin)', rime:'ink', color:'#2F6FA0',
   real:['th','p','s','w','l','dr','bl','st','sh'], silly:['v','z','g','m']},
  {id:'ick', sound:'th (thin)', rime:'ick', color:'#2F6FA0',
   real:['th','k','l','p','s','t','br','ch','st','tr'], silly:['v','z','g','m']},
  {id:'is', sound:'th (them)', rime:'is', color:'#3D8FCB',
   real:['th','h'], silly:['v','z','g','m']},
  {id:'at', sound:'th (them)', rime:'at', color:'#3D8FCB',
   real:['th','c','b','h','m','p','r','s','fl','ch','sp'], silly:['v','z','g','k']},
  {id:'uick', sound:'qu', rime:'ick', color:'#C05780',
   real:['qu','k','l','p','s','t','br','ch','st','tr'], silly:['v','z','g','m']},
  {id:'ueen', sound:'qu', rime:'een', color:'#C05780',
   real:['qu','s','t','gr','scr'], silly:['v','z','m','d']},
  {id:'ale', sound:'wh', rime:'ale', color:'#5C8A3A',
   real:['wh','t','p','s','m','sc','st'], silly:['v','z','g','th']},
  {id:'eel', sound:'wh', rime:'eel', color:'#5C8A3A',
   real:['wh','f','h','p','st','kn'], silly:['v','z','g','m']},
  {id:'one', sound:'ph', rime:'one', color:'#D4772E',
   real:['ph','b','c','t','st','dr','al'], silly:['v','z','g','th']},
  {id:'age', sound:'g (gent)', rime:'age', color:'#9B6BC4',
   real:['p','c','r','s','st','w'], silly:['v','z','th','m']},
  {id:'ice', sound:'c (circle)', rime:'ice', color:'#0E8C8C',
   real:['m','n','r','d','tw','sl','pr','sp'], silly:['v','z','th','g']},
  {id:'ace', sound:'c (circle)', rime:'ace', color:'#0E8C8C',
   real:['f','r','l','p','sp','tr','gr','br'], silly:['v','z','th','m']}
];

const familySel=document.getElementById('family'), modeSel=document.getElementById('mode');
const slotOnset=document.getElementById('slotOnset'), slotRime=document.getElementById('slotRime');
const machine=document.getElementById('machine'), verdict=document.getElementById('verdict');
const rack=document.getElementById('rack'), list=document.getElementById('list');
const foundEl=document.getElementById('found'), totalEl=document.getElementById('total');
const winOverlay=document.getElementById('winOverlay'), winText=document.getElementById('winText');

let fam=null, tiles=[], found=new Set(), builtOrder=[], current=null;

const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function say(t){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-GB'; u.rate=.72; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* build the family dropdown, grouped by target sound */
(function fillSelect(){
  const groups={};
  FAMILIES.forEach(f=>{ (groups[f.sound]=groups[f.sound]||[]).push(f); });
  Object.entries(groups).forEach(([sound,fams])=>{
    const og=document.createElement('optgroup'); og.label=sound;
    fams.forEach(f=>{
      const o=document.createElement('option');
      o.value=f.id; o.textContent='-'+f.rime;
      og.appendChild(o);
    });
    familySel.appendChild(og);
  });
})();

function load(){
  fam = FAMILIES.find(f=>f.id===familySel.value) || FAMILIES[0];
  document.documentElement.style.setProperty('--fam',fam.color);
  machine.style.setProperty('--fam',fam.color);
  rack.style.setProperty('--fam',fam.color);

  const useSilly = modeSel.value==='mixed';
  tiles = shuffle([
    ...fam.real.map(o=>({o,real:true})),
    ...(useSilly?fam.silly.map(o=>({o,real:false})):[])
  ]);

  found=new Set(); builtOrder=[]; current=null;
  foundEl.textContent=0; totalEl.textContent=fam.real.length;
  slotRime.textContent=fam.rime;
  slotOnset.textContent='?'; slotOnset.classList.remove('filled');
  verdict.className='verdict idle';
  verdict.textContent='Tap a letter below to build a word';
  list.innerHTML='<span class="empty">Nothing built yet.</span>';
  winOverlay.classList.remove('show');
  drawRack();
}

function drawRack(){
  rack.innerHTML='';
  tiles.forEach(t=>{
    const b=document.createElement('button');
    b.className='tile';
    b.textContent=t.o;
    b.setAttribute('aria-label',t.o+' '+fam.rime);
    if(found.has(t.o)) b.classList.add('used');
    if(current===t.o) b.classList.add('current');
    b.addEventListener('click',()=>pick(t,b));
    rack.appendChild(b);
  });
}

function pick(t,btn){
  const word = t.o + fam.rime;
  current = t.o;
  slotOnset.textContent = t.o;
  slotOnset.classList.add('filled');

  machine.classList.remove('pop','silly'); void machine.offsetWidth;
  machine.classList.add(t.real?'pop':'silly');

  verdict.className = 'verdict ' + (t.real?'real':'silly');
  verdict.textContent = t.real ? '✅ '+word+' — that\'s a real word!' : '🤪 '+word+' — silly word!';
  say(word);

  if(!builtOrder.includes(word)){
    builtOrder.push(word);
    const empty=list.querySelector('.empty'); if(empty) empty.remove();
    const tok=document.createElement('span');
    tok.className='tokn'+(t.real?'':' sillyword');
    tok.textContent=word;
    list.appendChild(tok);
  }

  if(t.real && !found.has(t.o)){
    found.add(t.o);
    foundEl.textContent=found.size;
    if(found.size===fam.real.length) finish();
  }
  drawRack();
}

function finish(){
  winText.textContent = `You built all ${fam.real.length} real words in the -${fam.rime} family.`;
  say('Brilliant!');
  setTimeout(()=>winOverlay.classList.add('show'),600);
}

document.getElementById('sayBtn').addEventListener('click',()=>{ if(current) say(current+fam.rime); });
document.getElementById('shuffleBtn').addEventListener('click',()=>{ tiles=shuffle(tiles); drawRack(); });
document.getElementById('reset').addEventListener('click',load);
familySel.addEventListener('change',load);
modeSel.addEventListener('change',load);
document.getElementById('nextFamily').addEventListener('click',()=>{
  const i=FAMILIES.findIndex(f=>f.id===fam.id);
  familySel.value=FAMILIES[(i+1)%FAMILIES.length].id;
  load();
});

load();
</script>
</body>
</html>
