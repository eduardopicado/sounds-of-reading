<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="felt" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="#4DB062"/>
      <stop offset="1" stop-color="#23703A"/>
    </radialGradient>
    <radialGradient id="top" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#FFEB70"/>
      <stop offset="1" stop-color="#F2B400"/>
    </radialGradient>
    <radialGradient id="ball" cx="34%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3D8DB"/>
    </radialGradient>
    <clipPath id="pitch"><rect x="4" y="4" width="88" height="88" rx="18"/></clipPath>
  </defs>
  <!-- the felt, mown in bands, with the goal and its area at the top -->
  <rect x="4" y="4" width="88" height="88" rx="18" fill="url(#felt)"/>
  <g clip-path="url(#pitch)">
    <rect x="0" y="26" width="96" height="16" fill="#FFFFFF" opacity=".07"/>
    <rect x="0" y="58" width="96" height="16" fill="#FFFFFF" opacity=".07"/>
    <path d="M26 4v18h44V4" fill="none" stroke="#F4EFD9" stroke-width="2.4" opacity=".85"/>
    <rect x="37" y="0" width="22" height="7" rx="1.5" fill="#F4EFD9" opacity=".95"/>
    <circle cx="48" cy="104" r="24" fill="none" stroke="#F4EFD9" stroke-width="2.4" opacity=".85"/>
  </g>
  <!-- the button: its shadow down and right, its side, then its top -->
  <ellipse cx="42" cy="66" rx="23" ry="21" fill="#0B302F" opacity=".35"/>
  <circle cx="38" cy="60" r="22" fill="#B98600"/>
  <circle cx="38" cy="55" r="22" fill="url(#top)"/>
  <circle cx="38" cy="55" r="14.5" fill="#009B3A"/>
  <circle cx="38" cy="55" r="14.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".55"/>
  <circle cx="38" cy="55" r="6" fill="#1F3FA8"/>
  <!-- the ball, ahead of it on the way to goal -->
  <ellipse cx="71" cy="37" rx="11" ry="8" fill="#0B302F" opacity=".35"/>
  <circle cx="67" cy="31" r="11" fill="url(#ball)"/>
  <clipPath id="ballEdge"><circle cx="67" cy="31" r="11"/></clipPath>
  <!-- the patches of a real ball: one in the middle, five round the edge -->
  <g fill="#1E2A2A" clip-path="url(#ballEdge)">
    <path d="M67.00 27.40 L70.42 29.89 L69.12 33.91 L64.88 33.91 L63.58 29.89Z"/>
    <path d="M70.64 25.98 L69.41 22.18 L72.64 19.83 L75.88 22.18 L74.64 25.98Z M72.90 32.92 L76.13 30.57 L79.36 32.92 L78.13 36.72 L74.13 36.72Z M67.00 37.20 L70.23 39.55 L69.00 43.35 L65.00 43.35 L63.77 39.55Z M61.10 32.92 L59.87 36.72 L55.87 36.72 L54.64 32.92 L57.87 30.57Z M63.36 25.98 L59.36 25.98 L58.12 22.18 L61.36 19.83 L64.59 22.18Z"/>
  </g>
  <circle cx="67" cy="31" r="11" fill="none" stroke="#0B302F" stroke-width="1" opacity=".5"/>
</svg>
